<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FAF8F5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>ZHS Youth Parliament for Action and Change (ZYPAC) | 14 November</title>
    <meta name="description" content="Official portal for ZHS Youth Parliament for Action and Change (ZYPAC) on 14 November. Debate. Decide. Deliver." />
    <meta property="og:title" content="ZHS Youth Parliament for Action and Change (ZYPAC)" />
    <meta property="og:description" content="Official portal for ZHS Youth Parliament for Action and Change (ZYPAC) on 14 November. Debate. Decide. Deliver." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- GitHub Pages Trailing-Slash Auto-Correction (Prevents 404 on relative asset loads) -->
    <script>
      (function() {
        var l = window.location;
        if (
          l.hostname.endsWith('github.io') &&
          l.pathname &&
          !l.pathname.endsWith('/') &&
          !l.pathname.split('/').pop().includes('.')
        ) {
          l.replace(l.pathname + '/' + l.search + l.hash);
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    <!-- Fail-safe diagnostic handler: catches any bundle loading or execution errors -->
    <script>
      window.__ZYPAC_BOOT_START__ = Date.now();
      window.addEventListener('error', function(e) {
        var loader = document.getElementById('initial-loading');
        if (!loader || window.__ZYPAC_MOUNTED__) return;
        var subtext = document.getElementById('loading-subtext');
        var errDetail = document.getElementById('loading-error-detail');
        if (subtext) subtext.textContent = 'A browser error occurred while starting the portal.';
        if (errDetail) {
          errDetail.textContent = e.message || 'Script resource could not be loaded.';
          errDetail.style.display = 'block';
        }
        var actions = document.getElementById('loading-actions');
        if (actions) actions.style.display = 'flex';
      }, true);

      // Auto-recovery timeout if mounting takes longer than 3.5 seconds
      setTimeout(function() {
        if (!window.__ZYPAC_MOUNTED__) {
          var subtext = document.getElementById('loading-subtext');
          var actions = document.getElementById('loading-actions');
          if (subtext) subtext.innerHTML = 'Connecting to parliamentary assets...<br><span style="font-size:0.75rem;color:#8A8A8A;">If your browser is using an older cached version, click below:</span>';
          if (actions) actions.style.display = 'flex';
        }
      }, 3500);
    </script>
  </head>
  <body class="bg-[#FAF8F5] text-[#2B2B2B] antialiased selection:bg-[#B08D57]/20 selection:text-[#1F3D33] overflow-x-hidden min-h-screen">
    <div id="root">
      <!-- Fallback loader visible only while the JS bundle is initializing -->
      <div id="initial-loading" style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; background-color: #FAF8F5; color: #1F3D33; text-align: center; padding: 24px;">
        <div style="width: 48px; height: 48px; border: 3px solid rgba(31,61,51,0.15); border-top-color: #1F3D33; border-radius: 50%; animation: zypac-spin 0.8s linear infinite; margin-bottom: 20px;"></div>
        <h2 style="font-size: 1.15rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; margin: 0 0 6px 0; color: #1F3D33;">ZYPAC Portal</h2>
        <p id="loading-subtext" style="font-size: 0.85rem; color: #6B6B6B; margin: 0 0 12px 0; max-width: 320px; line-height: 1.5;">Loading Youth Parliament environment...</p>
        <div id="loading-error-detail" style="display: none; font-size: 0.75rem; color: #b91c1c; background: #fee2e2; border: 1px solid #fecaca; padding: 6px 12px; border-radius: 4px; margin-bottom: 14px; max-width: 360px; word-break: break-all;"></div>
        <div id="loading-actions" style="display: none; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 6px;">
          <button onclick="window.location.reload(true)" style="background: #1F3D33; color: #FAF8F5; border: none; padding: 8px 16px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; cursor: pointer;">
            Force Reload
          </button>
          <button onclick="try{localStorage.clear();sessionStorage.clear();}catch(e){}window.location.reload(true)" style="background: transparent; color: #B08D57; border: 1px solid #B08D57; padding: 8px 16px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; cursor: pointer;">
            Clear Cache & Reload
          </button>
        </div>
        <noscript>
          <p style="margin-top: 15px; color: #b91c1c;">JavaScript is required to display the parliamentary portal.</p>
        </noscript>
      </div>
      <style>
        @keyframes zypac-spin { to { transform: rotate(360deg); } }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
